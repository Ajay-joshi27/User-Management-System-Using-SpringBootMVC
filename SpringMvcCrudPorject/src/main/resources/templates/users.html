
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/user/all}">
            User Management System
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Registered Users</h2>
            <p class="text-muted mb-0">Manage your registered users</p>
        </div>

        <a th:href="@{/user/register}" class="btn btn-primary">
            + Add New User
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Update</th>
                        <th>Delete</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="u : ${users}">

                        <td th:text="${u.id}"></td>
                        <td th:text="${u.firstname}"></td>
                        <td th:text="${u.lastname}"></td>
                        <td th:text="${u.gmail}"></td>

                        <!-- UPDATE FORM -->
                        <td>
                            <form th:action="@{/user/edit}"
                                  method="post">

                                <input type="hidden"
                                       name="id"
                                       th:value="${u.id}">

                                <button type="submit"
                                        class="btn btn-sm btn-warning">
                                    Update
                                </button>

                            </form>
                        </td>

                        <!-- DELETE FORM -->
                        <td>
                            <form th:action="@{/user/delete}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this user?');">

                                <input type="hidden"
                                       name="id"
                                       th:value="${u.id}">

                                <button type="submit"
                                        class="btn btn-sm btn-danger">
                                    Delete
                                </button>

                            </form>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="6"
                            class="text-center text-muted py-4">
                            No users registered yet.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>
        </div>
    </div>

</div>

</body>
</html>
