
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/user/all}">
            User Management System
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card border-0 shadow">

                <div class="card-header bg-warning py-3">
                    <h3 class="mb-0 text-center">
                        Update User Details
                    </h3>
                </div>

                <div class="card-body p-4">

                    <form th:action="@{/user/update}"
                          th:object="${user}"
                          method="post">

                        <!-- Hidden ID -->
                        <input type="hidden"
                               name="id"
                               th:value="${user.id}">

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                User ID
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:value="${user.id}"
                                   readonly>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                First Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{firstname}"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Last Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{lastname}"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Email Address
                            </label>

                            <input type="email"
                                   class="form-control"
                                   th:field="*{gmail}"
                                   required>

                        </div>

                        <div class="d-grid gap-2">

                            <button type="submit"
                                    class="btn btn-warning btn-lg">
                                Save Changes
                            </button>

                            <a th:href="@{/user/all}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
